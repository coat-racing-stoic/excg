version: '3.8'

# Production docker-compose with nginx reverse proxy
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  crypto-exchange-api:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      replicas: 1
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  nginx:
    image: nginx:alpine
    container_name: crypto-exchange-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      crypto-exchange-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-exchange-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
