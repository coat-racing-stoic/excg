services:
  crypto-exchange-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-exchange-api
    ports:
      - "${PORT:-12000}:${PORT:-12000}"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-12000}
      - DEBUG=${DEBUG:-false}
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
    volumes:
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-exchange-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-12000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: crypto-exchange-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - crypto-exchange-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  crypto-exchange-network:
    driver: bridge